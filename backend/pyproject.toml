[project]
name = "cmmcready"
version = "0.1.0"
description = "CMMC Ready: a CMMC Level 2 / NIST SP 800-171 Rev 2 self-assessment aid."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
