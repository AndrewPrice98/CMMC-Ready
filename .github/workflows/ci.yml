name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Tests
        working-directory: backend
        run: python -m pytest -q
      - name: Validate control catalog
        working-directory: backend
        run: python -m cmmcready catalog --check

  windows-collector:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      # GitHub-hosted runners run as an administrator; the non-admin path is
      # covered by the synthetic fixtures in backend/tests.
      - name: Collect with PowerShell 7
        shell: pwsh
        run: pwsh -File collectors/collect-windows.ps1 -OutFile out-pwsh.json
      - name: Collect with Windows PowerShell 5.1
        shell: powershell
        run: powershell -File collectors/collect-windows.ps1 -OutFile out-ps51.json
      - name: Parse collector output
        working-directory: backend
        run: |
          python -m cmmcready collect-parse windows ../out-pwsh.json
          python -m cmmcready collect-parse windows ../out-ps51.json

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt
      - name: Audit root requirements (Vercel function)
        run: pip-audit -r requirements.txt

  secrets:
    runs-on: ubuntu-latest
    # gitleaks-action v2 lists a pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
